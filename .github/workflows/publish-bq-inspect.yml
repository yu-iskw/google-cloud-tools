name: Publish bq-inspect

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate-release-tag:
    name: Verify release tag matches package version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify release tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          case "${TAG}" in
            bq-inspect-v*) ;;
            *)
              echo "Release tag must match bq-inspect-v*, got ${TAG}"
              exit 1
              ;;
          esac
          PKG_VERSION=$(node -p "require('./packages/bq-inspect/package.json').version")
          EXPECTED="bq-inspect-v${PKG_VERSION}"
          if [ "${TAG}" != "${EXPECTED}" ]; then
            echo "Release tag must be ${EXPECTED}, got ${TAG}"
            exit 1
          fi

  publish-bq-inspect:
    name: Publish bq-inspect to npm
    needs: validate-release-tag
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_reusable-publish-package.yml
    with:
      package_filter: bq-inspect
      package_directory: packages/bq-inspect
      test_path: packages/bq-inspect
      environment: release
