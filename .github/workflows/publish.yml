name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  validate-release-tag:
    name: Verify release tag matches package version
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify release tag
        run: |
          PKG_VERSION=$(node -p "require('./packages/bq-inspect/package.json').version")
          TAG="${{ github.event.release.tag_name }}"
          EXPECTED="bq-inspect-v${PKG_VERSION}"
          if [ "${TAG}" != "${EXPECTED}" ]; then
            echo "Release tag must be ${EXPECTED}, got ${TAG}"
            exit 1
          fi

  publish-bq-inspect:
    name: Publish bq-inspect to npm
    needs: validate-release-tag
    if: >-
      always() &&
      (needs.validate-release-tag.result == 'success' ||
       needs.validate-release-tag.result == 'skipped')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_reusable-publish-package.yml
    with:
      package_filter: bq-inspect
      package_directory: packages/bq-inspect
      test_path: packages/bq-inspect
